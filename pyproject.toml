[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wealthpilot-ai"
version = "0.1.0"
description = "Autonomous Portfolio Rebalancing Agent with Explainable Decisions (Project 1D)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Zetheta Algorithm Quantitative Engineering Team", email = "engineering@zetheta.ai" }
]
keywords = [
    "portfolio-management",
    "rebalancing",
    "drift-monitoring",
    "explainable-ai",
    "wealth-management",
    "sebi-compliance",
    "agentic-ai",
    "cvxpy",
    "crewai"
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "scipy>=1.11.0",
    "cvxpy>=1.4.0",
    "streamlit>=1.30.0",
    "shap>=0.44.0",
    "lime>=0.2.0.1",
    "crewai>=0.28.0",
    "langchain>=0.1.0",
    "python-dotenv>=1.0.0",
    "plotly>=5.18.0",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "black>=23.12.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --durations=10"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.coverage.run]
source = ["src"]
omit = [
    "src/dashboard/*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true

