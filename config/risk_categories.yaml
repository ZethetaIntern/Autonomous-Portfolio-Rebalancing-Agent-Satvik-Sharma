# Risk Category Profiles and Target Strategic Asset Allocation (SAA)
# Project 1D: Autonomous Portfolio Rebalancing Agent with Explainable Decisions

risk_categories:
  Ultra-Conservative:
    code: "UC"
    description: "Capital preservation priority with minimal drawdown tolerance."
    target_weights:
      NIFTY_50_EQUITY: 0.10
      G_SEC_BONDS: 0.50
      CORP_BONDS: 0.25
      GOLD_ETF: 0.05
      LIQUID_CASH: 0.10
    drift_band_pct: 0.020        # 2.0% absolute drift threshold
    sad_threshold: 0.040         # Sum of Absolute Drift breach
    rmsd_threshold: 0.015        # RMSD breach
    max_tracking_error_pct: 0.015
    rebalance_frequency: "QUARTERLY"
    turnover_limit_annual_pct: 0.25

